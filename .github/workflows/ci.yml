name: CPU correctness
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  core:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install torch==2.8.0 --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -e '.[train,dev]'
      - run: ruff check src tests
      - run: ruff format --check src tests
      - run: pytest -m 'not cuda and not ray and not spark'
      - run: tailtrace demo --out runs/demo
      - run: tailtrace schedule-audit --seeds 17 23 31 43 47 59 61 73 --out runs/scheduling-audit
      - name: Verify committed oracle evidence
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          actual = json.loads(Path('runs/scheduling-audit/campaign.json').read_text())
          expected = json.loads(Path('results/scheduling-audit/campaign.json').read_text())
          assert actual == expected, 'committed campaign no longer reproduces'
          PY
      - run: tailtrace calibrate --config configs/cpu-baseline.json --repeats 3 --out runs/calibration
      - uses: actions/upload-artifact@v4
        with:
          name: cpu-evidence
          path: |
            runs/scheduling-audit
            runs/calibration
  ray:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install torch==2.8.0 --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -e '.[ray,dev]'
      - run: pytest tests/test_ray.py -m ray
  spark:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: pip install -e '.[spark,dev]'
      - run: pytest tests/test_spark.py -m spark
