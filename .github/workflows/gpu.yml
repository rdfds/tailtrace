name: Manual NVIDIA validation
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cuda:
    runs-on: [self-hosted, linux, x64, gpu]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: nvidia-smi
      - run: nvcc --version
      - run: python -m pip install -e '.[train,dev]' ninja
      - run: python -m pytest tests/test_cuda.py -m cuda
      - run: python -m torch.distributed.run --standalone --nproc-per-node=2 tests/gpu_equivalence_worker.py runs/gpu-equivalence.json
      - run: tailtrace kernel-bench --rows 4096 --width 1024 --out runs/kernel.json
      - uses: actions/upload-artifact@v4
        with:
          name: gpu-validation-evidence
          path: runs/
